<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/updateAttraction.css}">
    <title>Update Attraction</title>
</head>
<body>

<header>
    <h1>Turist Guide</h1>
</header>

<div class="navBar">
    <a href="/">Home</a>
    <a href="attractions">Attraktioner</a>
    <a href="attractions/Tivoli">Tivoli</a>
    <div class="dropdown">Links
        <div class="dropdown-content">
            <ul>
                <li>
                    <a href="https://www.publictransport.dk/?gad_source=1&gad_campaignid=21354478750&gbraid=0AAAAAp9lQb8iV87klY0eNayVsJD3SATgL&gclid=Cj0KCQjwkt_UBhDMARIsALpnOAwp7IUP9wRvAfO8HP_fgTXF30QwHq_fUINC1Tf171FPbahQzvBeq1MaAoP4EALw_wcB">City
                        Pass</a></li>
                <li><a href="https://www.rejseplanen.dk/webapp/#!P|TP!histId|0!histKey|H910521">Rejseplanen</a></li>
                <li>
                    <a href="https://dantaxi.dk/?gad_source=1&gad_campaignid=22803504203&gbraid=0AAAAADlbdCKThs5_YWX6ii9U02-Lo-RFu&gclid=Cj0KCQjwkt_UBhDMARIsALpnOAyaSEHn4paKN8oowmTlScHjQ7_gvF3lp3mm2hhWO7fu-hWq7KxFX9saAlKBEALw_wcB">Dantaxi</a>
                </li>
                <li><a href="https://www.donkey.bike/da/cities/copenhagen">Lej en cykel</a></li>
            </ul>
        </div>
    </div>
</div>


<section class="confirmation-box">
    <h2><u>Ændringer gemt</u></h2>
    <b>Navn:</b><p th:text="${attraction.name}"></p>
    <br />
    <b>Beskrivelse:</b><p th:text="${attraction.description}"></p>
    <br />
    <b>By:</b><p th:text="${attraction.city}"></p>
    <br />
    <b>Tags:</b>
    <section th:each="Tag : ${tagsList}">
        <p th:if="*{Tag.name() eq 'ARCHITECTURE'}">Arkitektur</p>
        <p th:if="*{Tag.name() eq 'ARCHITECTURE'}">Arkitektur</p>
        <p th:if="*{Tag.name() eq 'KID_FRIENDLY'}">Børnevenligt</p>
        <p th:if="*{Tag.name() eq 'AMUSEMENT_PARK'}">Forlystelsespark</p>
        <p th:if="*{Tag.name() eq 'HISTORY'}">Historie</p>
        <p th:if="*{Tag.name() eq 'ART'}">Kunst</p>
        <p th:if="*{Tag.name() eq 'MUSEUM'}">Museum</p>
        <p th:if="*{Tag.name() eq 'NATURE'}">Natur</p>
        <p th:if="*{Tag.name() eq 'CASTLE'}">Slot</p>
        <p th:if="*{Tag.name() eq 'ZOO'}">Zoologisk Have</p>
    </section>
</section>

<nav class="actions">
    <a href="/attractions" class="button">Tilbage til listen</a>
</nav>

</body>
</html>
